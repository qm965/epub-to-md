[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-to-md"
version = "0.1.2"
description = "Convert EPUB files to single Markdown files with embedded images"
requires-python = ">=3.11"
dependencies = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "click>=8.1",
    "lxml>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
epub-to-md = "epub_to_md.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
